services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ingryd
      POSTGRES_PASSWORD: ingryd
      POSTGRES_DB: ingryd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingryd"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
